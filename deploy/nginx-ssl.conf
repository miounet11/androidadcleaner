# androidadcleaner.com — 静态站点（HTTP → HTTPS）
# 证书: /etc/letsencrypt/live/androidadcleaner.com/

server {
    listen 80;
    listen [::]:80;
    server_name androidadcleaner.com www.androidadcleaner.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.androidadcleaner.com$request_uri;
    }

    access_log /var/log/nginx/androidadcleaner.access.log;
    error_log  /var/log/nginx/androidadcleaner.error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name androidadcleaner.com www.androidadcleaner.com;

    ssl_certificate     /etc/letsencrypt/live/androidadcleaner.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/androidadcleaner.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ADC:10m;
    ssl_session_timeout 1d;

    # 统一到 www
    if ($host = androidadcleaner.com) {
        return 301 https://www.androidadcleaner.com$request_uri;
    }

    root /var/www/androidadcleaner;
    index index.html;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|ttf|otf|xml|txt|json|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/androidadcleaner.access.log;
    error_log  /var/log/nginx/androidadcleaner.error.log;
}
