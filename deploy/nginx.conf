# androidadcleaner.com — 静态站点
# 证书签发后由 certbot 自动注入 443 段

server {
    listen 80;
    listen [::]:80;
    server_name androidadcleaner.com www.androidadcleaner.com;

    root /var/www/androidadcleaner;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 带扩展名的真实文件优先
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|ttf|otf|xml|txt|json|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # HTML 短缓存，便于内容更新即时生效
    location ~* \.html$ {
        expires 10m;
        add_header Cache-Control "public, max-age=600, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/androidadcleaner.access.log;
    error_log  /var/log/nginx/androidadcleaner.error.log;
}
