  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 右侧装饰：屏蔽环 -->
  <g opacity="0.13" fill="none" stroke="#a8d9d5" stroke-width="2">
    <circle cx="985" cy="315" r="250"/>
    <circle cx="985" cy="315" r="185"/>
    <circle cx="985" cy="315" r="120"/>
  </g>
  <g opacity="0.9">
